<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtsyGlow — AI Listing Audit</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0d0618;font-family:'Nunito',sans-serif;min-height:100vh;padding:24px 16px;color:#f0e6ff;}
  .wrap{max-width:560px;margin:0 auto;}
  .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
  .logo-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#c026d3,#7c3aed,#f97316);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 20px rgba(192,38,211,0.5);}
  .logo-text{font-family:'Fredoka One',cursive;font-size:26px;background:linear-gradient(135deg,#e879f9,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo-text span{background:linear-gradient(135deg,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  h1{font-family:'Fredoka One',cursive;font-size:30px;text-align:center;margin-bottom:4px;}
  .sub{text-align:center;font-size:14px;color:#a78bfa;font-weight:700;margin-bottom:24px;}
  .card{background:#120821;border-radius:20px;border:1px solid rgba(168,85,247,0.2);padding:24px;margin-bottom:16px;box-shadow:0 8px 40px rgba(124,58,237,0.15);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{padding:8px 18px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;border:1px solid rgba(168,85,247,0.2);background:transparent;color:#a78bfa;transition:all 0.2s;}
  .tab.active{border-color:rgba(192,38,211,0.5);background:rgba(192,38,211,0.2);color:#e879f9;}
  label{font-size:13px;font-weight:800;color:#a78bfa;display:block;margin-bottom:6px;}
  input,textarea{width:100%;background:rgba(124,58,237,0.08);border:1px solid rgba(168,85,247,0.2);border-radius:12px;padding:12px 14px;color:#f0e6ff;font-size:14px;font-family:'Nunito',sans-serif;font-weight:600;outline:none;resize:vertical;}
  input::placeholder,textarea::placeholder{color:rgba(167,139,250,0.4);}
  input:focus,textarea:focus{border-color:rgba(192,38,211,0.5);}
  .field{margin-bottom:12px;}
  .btn{width:100%;margin-top:16px;background:linear-gradient(135deg,#c026d3,#7c3aed);color:#fff;font-family:'Fredoka One',cursive;font-size:18px;padding:13px 0;border-radius:50px;border:none;cursor:pointer;box-shadow:0 0 24px rgba(192,38,211,0.5);}
  .btn:disabled{background:rgba(192,38,211,0.3);box-shadow:none;cursor:not-allowed;}
  .btn-ghost{width:100%;background:transparent;color:#a78bfa;font-family:'Fredoka One',cursive;font-size:16px;padding:12px 0;border-radius:50px;border:1px solid rgba(168,85,247,0.2);cursor:pointer;margin-bottom:8px;}
  .error{margin-top:12px;padding:10px 14px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);border-radius:10px;font-size:13px;color:#f43f5e;font-weight:700;}
  .spinner{text-align:center;padding:30px 0;}
  .spin{width:50px;height:50px;border:3px solid rgba(168,85,247,0.2);border-top:3px solid #c026d3;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
  .spin-label{font-family:'Fredoka One',cursive;font-size:17px;color:#a78bfa;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Score ring */
  .ring-wrap{display:flex;justify-content:center;margin-bottom:14px;}
  .verdict{font-size:15px;font-weight:700;text-align:center;line-height:1.5;}
  /* Bar */
  .bar-track{flex:1;height:7px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:10px;}
  .cat-card{background:rgba(124,58,237,0.08);border:1px solid rgba(168,85,247,0.2);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .cat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cat-name{display:flex;align-items:center;gap:8px;font-family:'Fredoka One',cursive;font-size:16px;}
  .cat-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .cat-tip{font-size:12px;color:#a78bfa;line-height:1.5;}
  .pill{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .list-box{background:rgba(124,58,237,0.06);border:1px solid rgba(168,85,247,0.2);border-radius:14px;padding:14px 16px;}
  .list-title{font-family:'Fredoka One',cursive;font-size:15px;margin-bottom:10px;}
  .list-item{display:flex;gap:8px;margin-bottom:6px;font-size:13px;color:#a78bfa;line-height:1.5;}
  .section-title{font-family:'Fredoka One',cursive;font-size:18px;margin-bottom:14px;}
  /* Access gate */
  #access-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .access-card{width:100%;max-width:420px;background:#120821;border-radius:24px;border:1px solid rgba(168,85,247,0.2);padding:32px;box-shadow:0 8px 40px rgba(124,58,237,0.2);}
  .access-icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#c026d3,#7c3aed,#f97316);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;box-shadow:0 0 24px rgba(192,38,211,0.5);}
  .access-title{font-family:'Fredoka One',cursive;font-size:26px;text-align:center;margin-bottom:6px;}
  .access-sub{font-size:13px;color:#a78bfa;font-weight:700;text-align:center;margin-bottom:24px;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- ACCESS GATE -->
<div id="access-screen">
  <div class="access-card">
    <div class="access-icon">✨</div>
    <div class="access-title">EtsyGlow</div>
    <div class="access-sub">Enter your access code to get started 🔑</div>
    <label>Access Code</label>
    <input id="code-input" type="text" placeholder="GLOW-XXXX-1234" style="text-transform:uppercase;letter-spacing:2px;" />
    <div id="access-error" class="error hidden"></div>
    <button class="btn" onclick="verifyCode()" style="margin-top:16px;">✨ Unlock EtsyGlow</button>
    <p style="text-align:center;font-size:12px;color:#6d3fa6;margin-top:14px;font-weight:700;">Purchased on Beacons? Check your email for your code.</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-icon">✨</div>
      <div class="logo-text">Etsy<span>Glow</span></div>
    </div>
    <h1>AI Listing Audit</h1>
    <p class="sub">Find out exactly why your listings aren't selling ✨</p>

    <div class="card" id="input-card">
      <div class="tabs">
        <button class="tab active" onclick="setMode('title',this)">📝 Title only</button>
        <button class="tab" onclick="setMode('full',this)">📋 Full listing</button>
        <button class="tab" onclick="setMode('url',this)">🔗 Listing URL</button>
      </div>

      <div id="mode-title">
        <div class="field"><label>Listing Title</label><input id="title" placeholder="e.g. Personalised Silver Name Necklace, Gift for Her..." /></div>
      </div>
      <div id="mode-full" class="hidden">
        <div class="field"><label>Title *</label><input id="title-full" placeholder="Your listing title..." /></div>
        <div class="field"><label>Description</label><textarea id="desc" rows="4" placeholder="Paste your description..."></textarea></div>
        <div class="field"><label>Tags</label><input id="tags" placeholder="silver necklace, personalised gift, custom jewellery..." /></div>
      </div>
      <div id="mode-url" class="hidden">
        <div class="field"><label>Etsy Listing URL</label><input id="url" placeholder="https://www.etsy.com/listing/..." /></div>
      </div>

      <div id="input-error" class="error hidden"></div>
      <button class="btn" id="audit-btn" onclick="runAudit()">✨ Run My Audit</button>
    </div>

    <div id="spinner" class="hidden">
      <div class="spinner"><div class="spin"></div><div class="spin-label">Analysing your listing ✨</div></div>
    </div>

    <div id="results" class="hidden"></div>
  </div>
</div>

<script>
let currentMode = 'title';

function setMode(m, el) {
  currentMode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['title','full','url'].forEach(id => {
    document.getElementById('mode-'+id).classList.toggle('hidden', id !== m);
  });
}

async function verifyCode() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  const errEl = document.getElementById('access-error');
  errEl.classList.add('hidden');
  if (!code) { errEl.textContent = 'Please enter your access code.'; errEl.classList.remove('hidden'); return; }
  try {
    const res = await fetch('/api/verify', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({code}) });
    const data = await res.json();
    if (!data.ok) { errEl.textContent = '⚠️ ' + data.error; errEl.classList.remove('hidden'); return; }
    document.getElementById('access-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  } catch(e) {
    errEl.textContent = '⚠️ Connection error. Please try again.';
    errEl.classList.remove('hidden');
  }
}

async function runAudit() {
  const errEl = document.getElementById('input-error');
  errEl.classList.add('hidden');
  let msg = '';
  if (currentMode === 'title') {
    const t = document.getElementById('title').value.trim();
    if (!t) { errEl.textContent = '⚠️ Please enter a listing title.'; errEl.classList.remove('hidden'); return; }
    msg = `Audit this Etsy listing title: ${t}`;
  } else if (currentMode === 'full') {
    const t = document.getElementById('title-full').value.trim();
    if (!t) { errEl.textContent = '⚠️ Please enter a title.'; errEl.classList.remove('hidden'); return; }
    const d = document.getElementById('desc').value.trim();
    const tg = document.getElementById('tags').value.trim();
    msg = `Audit this Etsy listing:\nTitle: ${t}\nDescription: ${d}\nTags: ${tg}`;
  } else {
    const u = document.getElementById('url').value.trim();
    if (!u) { errEl.textContent = '⚠️ Please enter a URL.'; errEl.classList.remove('hidden'); return; }
    msg = `Audit this Etsy listing URL: ${u}`;
  }

  document.getElementById('audit-btn').disabled = true;
  document.getElementById('spinner').classList.remove('hidden');
  document.getElementById('results').classList.add('hidden');

  try {
    const res = await fetch('/api/audit', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({message: msg}) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const match = data.text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('Could not parse result. Please try again.');
    const r = JSON.parse(match[0]);
    renderResults(r);
  } catch(e) {
    errEl.textContent = '⚠️ ' + (e.message || 'Something went wrong. Please try again.');
    errEl.classList.remove('hidden');
  } finally {
    document.getElementById('audit-btn').disabled = false;
    document.getElementById('spinner').classList.add('hidden');
  }
}

function scoreColor(s) { return s >= 80 ? '#4ade80' : s >= 60 ? '#fbbf24' : '#f43f5e'; }
function pillStyle(status) {
  const m = { 'Excellent': ['rgba(74,222,128,0.15)','#4ade80','rgba(74,222,128,0.3)'], 'Good': ['rgba(251,191,36,0.15)','#fbbf24','rgba(251,191,36,0.3)'], 'Needs Work': ['rgba(249,115,22,0.15)','#fb923c','rgba(249,115,22,0.3)'], 'Critical': ['rgba(244,63,94,0.15)','#f43f5e','rgba(244,63,94,0.3)'] };
  const [bg,c,b] = m[status]||m['Good'];
  return `background:${bg};color:${c};border:1px solid ${b};`;
}

function renderResults(r) {
  const c = scoreColor(r.overallScore);
  const pct = r.overallScore;
  const size = 110;
  const inner = size * 0.73;

  const cats = [
    ['📝','Titles',r.categories.titles],
    ['🔍','Keywords',r.categories.keywords],
    ['📸','Photos',r.categories.photos],
    ['⚙️','SEO Setup',r.categories.seo],
    ['📋','Structure',r.categories.structure],
  ];

  const catHTML = cats.map(([icon,name,d]) => {
    const cc = scoreColor(d.score);
    return `<div class="cat-card">
      <div class="cat-top">
        <div class="cat-name">${icon} ${name}</div>
        <span class="pill" style="${pillStyle(d.status)}">${d.status}</span>
      </div>
      <div class="cat-bar">
        <div class="bar-track"><div class="bar-fill" style="width:${d.score}%;background:${cc};box-shadow:0 0 6px ${cc}99;"></div></div>
        <span style="font-size:13px;font-weight:800;width:32px;text-align:right;">${d.score}%</span>
      </div>
      <div class="cat-tip">💡 ${d.tip}</div>
    </div>`;
  }).join('');

  function listBox(title, emoji, items, color) {
    const items_html = items.map(i => `<div class="list-item"><span style="color:${color};">•</span>${i}</div>`).join('');
    return `<div class="list-box"><div class="list-title">${emoji} ${title}</div>${items_html}</div>`;
  }

  document.getElementById('results').innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-family:'Fredoka One',cursive;font-size:15px;color:#a78bfa;margin-bottom:14px;">Overall Listing Score</div>
      <div class="ring-wrap">
        <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${c} 0% ${pct}%, rgba(255,255,255,0.07) ${pct}% 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px ${c}44,0 0 24px ${c}44;">
          <div style="width:${inner}px;height:${inner}px;border-radius:50%;background:#1a0a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <span style="font-family:'Fredoka One',cursive;font-size:${size*0.28}px;color:${c};line-height:1;">${r.overallScore}</span>
            <span style="font-size:11px;color:#a78bfa;font-weight:800;">/100</span>
          </div>
        </div>
      </div>
      <div class="verdict">${r.verdict}</div>
    </div>
    <div class="card">
      <div class="section-title">📊 Category Breakdown</div>
      ${catHTML}
    </div>
    <div class="grid2" style="margin-bottom:14px;">
      ${listBox("What's Hurting","🎯",r.hurting,"#f43f5e")}
      ${listBox("What's Working","✅",r.working,"#4ade80")}
      ${listBox("What to Improve","💡",r.improve,"#fbbf24")}
      ${listBox("Don't Change","🚫",r.doNotChange,"#a78bfa")}
    </div>
    <button class="btn-ghost" onclick="resetAudit()">↩ Audit Another Listing</button>
  `;
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function resetAudit() {
  document.getElementById('results').classList.add('hidden');
  document.getElementById('title').value = '';
  document.getElementById('title-full').value = '';
  document.getElementById('desc').value = '';
  document.getElementById('tags').value = '';
  document.getElementById('url').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('code-input').addEventListener('keydown', e => { if(e.key==='Enter') verifyCode(); });
</script>
</body>
</html>
